<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }
        h1 {
            color: #007BFF;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Me livrei da maldição!!</p>
    <script>
        window.alert("Minha primeira mensagem em JavaScript!"); // Janela de alerta
        window.confirm("Está gostando de JavaScript?"); // Janela com botão de 'ok' e 'cancelar'
        window.prompt("Qual é o seu nome?"); // Vai pergunatr seu nome...
    </script>
</body>
</html>
