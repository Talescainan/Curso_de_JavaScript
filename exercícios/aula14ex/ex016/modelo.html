<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Vamos contar!</h1>

        <div id="res">
            Preparando a contagem...
        </div>

    <footer>
        <p>&copy; CursoemVídeo</p>
